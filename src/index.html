<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Coordinatore dei progetti</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applies the last theme before Angular starts, so a reload does not flash.
      // Same key as THEME_STORAGE_KEY in src/app/theme/theme.service.ts.
      try {
        var theme = localStorage.getItem('coordinator.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
