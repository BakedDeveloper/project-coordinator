<div class="shell" [class.shell--collapsed]="collapsed()" [class.shell--drawer-open]="drawerOpen()">
  <header class="topbar">
    <button
      #menuButton
      type="button"
      class="topbar__menu"
      aria-controls="side-menu"
      [attr.aria-expanded]="drawerOpen()"
      (click)="drawerOpen.set(!drawerOpen())"
    >
      <svg lucideMenu class="icon" aria-hidden="true"></svg>
      <span class="visually-hidden">Menu</span>
    </button>
    <a class="topbar__brand" routerLink="/">Coordinatore</a>
  </header>

  @if (drawerOpen()) {
    <div class="backdrop" aria-hidden="true" (click)="closeDrawer()"></div>
  }

  <nav id="side-menu" class="sidebar" aria-label="Menu principale">
    <a class="sidebar__brand" routerLink="/">
      <span class="sidebar__logo"
        ><svg lucideLayoutGrid class="icon" aria-hidden="true"></svg
      ></span>
      <span class="sidebar__brand-name">Coordinatore</span>
    </a>

    <ul class="nav">
      @for (item of sections; track item.path) {
        <li>
          <a
            class="nav__link"
            [routerLink]="item.path"
            routerLinkActive="nav__link--current"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
          >
            <svg [lucideIcon]="item.icon" class="icon" aria-hidden="true"></svg>
            <span class="nav__label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>

    <app-sidebar-projects class="sidebar__projects" [collapsed]="collapsed()" />

    <ul class="nav sidebar__foot">
      <li>
        <a
          class="nav__link"
          routerLink="/personalizzazione"
          routerLinkActive="nav__link--current"
          ariaCurrentWhenActive="page"
        >
          <svg lucidePalette class="icon" aria-hidden="true"></svg>
          <span class="nav__label">Personalizza</span>
        </a>
      </li>
      <li>
        <button
          class="nav__link"
          type="button"
          (click)="signOut()"
          [attr.aria-disabled]="signingOut()"
        >
          <svg lucideLogOut class="icon" aria-hidden="true"></svg>
          <span class="nav__label">Esci</span>
        </button>
      </li>
      <li class="sidebar__collapse">
        <button
          class="nav__link"
          type="button"
          [attr.aria-pressed]="collapsed()"
          (click)="settings.setSidebarCollapsed(!settings.sidebarCollapsed())"
        >
          @if (collapsed()) {
            <svg lucidePanelLeftOpen class="icon" aria-hidden="true"></svg>
          } @else {
            <svg lucidePanelLeftClose class="icon" aria-hidden="true"></svg>
          }
          <span class="nav__label">Riduci il menu</span>
        </button>
      </li>
    </ul>
  </nav>

  <div class="shell__content">
    <p class="shell__notice" role="status">
      @if (theme.saveFailed()) {
        <span class="shell__notice-text">
          Tema cambiato solo su questo dispositivo: non è stato salvato.
        </span>
      }
    </p>
    <main class="shell__main">
      <router-outlet />
    </main>
  </div>
</div>
