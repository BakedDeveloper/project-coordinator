<div class="page-header">
  <h1 class="page-header__title">Tutti i progetti</h1>
  <div class="toolbar">
    <div class="filters" role="group" aria-label="Ambito dei progetti">
      @for (s of scopes; track s.value) {
        <button
          type="button"
          class="filter"
          [attr.aria-pressed]="scope() === s.value"
          (click)="chooseScope(s.value)"
        >
          {{ s.label }}
        </button>
      }
    </div>
    <label class="project-filter">
      <span class="project-filter__label">Progetto</span>
      <select class="project-filter__select" (change)="chooseProject($event)">
        <option value="" [selected]="projectId() === null">Tutti i progetti</option>
        @for (p of projects(); track p.id) {
          <option [value]="p.id" [selected]="projectId() === p.id">{{ p.name }}</option>
        }
      </select>
    </label>
  </div>
</div>

@switch (state()) {
  @case ('loading') {
    <p class="message" role="status">Carico la board…</p>
  }
  @case ('error') {
    <div class="message message--error" role="alert">
      <p>Non riesco a caricare la board.</p>
      <button type="button" class="retry" (click)="load()">Riprova</button>
    </div>
  }
  @default {
    <app-board-columns [columns]="columns()" [today]="today()" (moved)="refresh()" />
  }
}
